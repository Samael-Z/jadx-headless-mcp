[package]
name = "jadx-headless-mcp"
version = "0.3.8"
edition = "2021"
rust-version = "1.80"
description = "Headless JADX Android decompiler exposed as a Model Context Protocol (MCP) server."
license = "Apache-2.0"
repository = "https://github.com/Samael-Z/jadx-headless-mcp"
readme = "README.md"
keywords = ["mcp", "jadx", "android", "decompiler", "reverse-engineering"]
categories = ["command-line-utilities", "development-tools"]
default-run = "jadx-mcp"

[[bin]]
name = "jadx-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
rmcp = { version = "1.7", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
    "macros",
] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
which = "8.0"
url = "2.5"
dirs = "5.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
